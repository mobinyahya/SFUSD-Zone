# Shared metric ordering for all robustness Excel outputs.
#
# Edit this file to reorder, add, or remove rows in every robustness
# metrics_comparison.xlsx (and the multi_policy reference) at once.
# All run_robustness_*.sh wrappers and run_multi_policy_estimates.sh
# read row_order from here when generating their analyze_trends config.
#
# After editing, re-run the per-axis ANALYZE step (no need to re-train
# or re-simulate):
#   bash scripts/run_multi_policy_estimates.sh --no-generate --no-simulate
#   bash scripts/robustness/run_robustness_models.sh         --no-generate --no-simulate
#   bash scripts/robustness/run_robustness_years.sh          --no-generate --no-simulate
#   bash scripts/robustness/run_robustness_listlength.sh     --no-generate --no-simulate
#   bash scripts/robustness/run_robustness_popularschools.sh --analyze-only


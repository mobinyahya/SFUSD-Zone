# SY26-27 enrolled kindergarteners. enrolled_match scores where they
# enrolled, with no mechanism run; neighborhood_assignment_#5 runs policy 5 on
# the same students.
# See README.md.
data:
  scenario: assignment-generated-zones-2627
  overrides:
    filters:
      assignment:
        student_population: enrolled
        capacity_profile: default
        include_mission_bay: true
iterations:
  end: 25
  start: 0
paths:
  assignment-folder: /soalnas/share/data/school_choice/local_runs/enrolled_metrics/2627/assignments
random-seed: 2023
export-aggregate-metrics: true
export-local-metrics: true
export_heatmaps: true
reuse_assignments: false

r1-only: true
rounds-merged-options:
- 0
save-assignment: true
subconfigs:
- enrolled_match
- neighborhood_assignment_#5
utility-model:
  designate-lp-for-all: false
  enable: false
  list-length: 0.8*round(real_length)
output_dir: /soalnas/share/data/school_choice/local_runs/enrolled_metrics/2627/

# Pipeline Configuration for student-assignment DA simulation
# Used by the pipeline orchestrator to run status_quo policy with utility model
#
# Variable substitution:
#   ${year} - test year in YYZZ format
#   ${train_year} - training year for the choice model
#   ${test_year} - test year (same as ${year})

grade: KG
year: ${year}

paths:
  # Estimate path from SFUSD-Choice pipeline output
  estimate-path: <SFUSD_CHOICE_PATH>/pipeline_output/train_${train_year}_test_${test_year}/estimates_${train_year}_${test_year}.csv

  # Student data - use R1-filtered file (generated by pipeline)
  student-data: <STUDENT_ASSIGNMENT_PATH>/local-data/pipeline_runs/train_${train_year}_test_${test_year}/r1_students_filtered.csv

  # Program and school data
  program-data: /share/data/school_choice/Data/Cleaned/programs_${year}.csv
  school-data: /share/data/school_choice/Data/Cleaned/schools_rehauled_${year}.csv

  # Base path for relative paths
  sfusd: /share/data/school_choice/Data/

  # Output folder for assignments
  assignment-folder: <STUDENT_ASSIGNMENT_PATH>/local-data/pipeline_runs/train_${train_year}_test_${test_year}/

  # Student precomputed data save location
  student-save: <STUDENT_ASSIGNMENT_PATH>/local-data/pipeline_runs/precomputed/

  # Zone files (for future use)
  zone-files:
    10zone: /share/data/school_choice/simulation-files/zones/10-zone-11_BG.csv
    13zone: /share/data/school_choice/simulation-files/zones/13-zone-7_BG.csv
    18zone_1: /share/data/school_choice/simulation-files/zones/18-zone-1_1_BG.csv
    18zone_2: /share/data/school_choice/simulation-files/zones/18-zone-1_2_BG.csv
    59zone: /share/data/school_choice/simulation-files/zones/59-zone-1_B.csv
    6zone-1: /share/data/school_choice/simulation-files/zones/6-zone-1_BG.csv
    Con1: /share/data/school_choice/simulation-files/zones/concept1zones.csv

# Utility model configuration
utility-model:
  enable: true
  designate-lp-for-all: false
  list-length: 0.8*round(real_length)
  save-path: <STUDENT_ASSIGNMENT_PATH>/local-data/pipeline_runs/train_${train_year}_test_${test_year}/utility_matrix.csv

# Policy to run (status_quo for historical comparison)
subconfigs:
  - status_quo

# Simulation settings
r1-only: true
random-seed: 2023
remove-special-lps: true

iterations:
  start: 0
  end: 10

save-assignment: true

rounds-merged-options:
  - 0

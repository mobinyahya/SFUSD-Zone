base_dir: "<STUDENT_ASSIGNMENT_PATH>/local-data/local-runs/status_quo_runs/"
output_dir: "metrics/filtered_trends"

# Metrics that produce a single value per simulation
# Optional: Manually specify runs to analyze.
# If this is set, 'base_dir' discovery is ignored.
runs:
  - label: "Distance < 2 miles"
    folder: "<STUDENT_ASSIGNMENT_PATH>/local-data/local-runs/filtered_distance_ranks/2_False_new/status_quo"
    year: 23
    config_path: "<STUDENT_ASSIGNMENT_PATH>/local-data/local-runs/filtered_distance_ranks/2_False_new/config.yaml"
    program_data: "/soalnas/share/data/school_choice/Data/Cleaned/programs_without_specialprogs_2324.csv"
    student_data: "/soalnas/share/data/school_choice/Data/Cleaned/r1_filter_student_without_specialprogs_2324.csv"
  - label: "Distance < 3 miles"
    folder: "<STUDENT_ASSIGNMENT_PATH>/local-data/local-runs/filtered_distance_ranks/3_False_new/status_quo"
    year: 23
    config_path: "<STUDENT_ASSIGNMENT_PATH>/local-data/local-runs/filtered_distance_ranks/3_False_new/config.yaml"
    program_data: "/soalnas/share/data/school_choice/Data/Cleaned/programs_without_specialprogs_2324.csv"
    student_data: "/soalnas/share/data/school_choice/Data/Cleaned/r1_filter_student_without_specialprogs_2324.csv"
  - label: "Baseline Run"
    folder: "<STUDENT_ASSIGNMENT_PATH>/local-data/local-runs/choice_01_12_2026/status_quo"
    year: 23
    config_path: "<STUDENT_ASSIGNMENT_PATH>/local-data/local-runs/choice_01_12_2026/config.yaml"
    program_data: "/soalnas/share/data/school_choice/Data/Cleaned/programs_without_specialprogs_2324.csv"
    student_data: "/soalnas/share/data/school_choice/Data/Cleaned/r1_filter_student_without_specialprogs_2324.csv"
    



year: 23

# --- List Augmentation Config ---
list-augmentation:
  enable: true
  # Targeting: "ctip_x_ethnicity" or "short_list_threshold"
  targeting-method: ctip_x_ethnicity
  short-list-threshold: 3
  # Oversubscribed: "apps_per_seat", "first_choice_per_seat", or "fixed_list"
  oversubscribed-method: first_choice_per_seat
  oversubscribed-ratio-threshold: 1.5
  oversubscribed-fixed-schools:
    - 420   # Alvarado
    - 478   # Clarendon
    - 497   # Webster
    - 521   # El Dorado
    - 722   # Miraloma
    - 735   # New Traditions
    - 867   # Vis Valley
  max-augmented-programs: 1

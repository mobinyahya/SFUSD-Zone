# Restrictive attendance areas (restrictive_aa.yaml) with the 11-18 tie-breakers:
#   sibling-access: true   a student may enter a sibling's school from outside
#                          their area, at sibling priority.
#   tk-access: false       a TK-to-K promote has no such exception: an
#                          out-of-area feeder stays closed, and the promote
#                          falls through to their own area's GE program.
#   CTIP priority:         on (ctip-options [1]).
#   reserves:              FRL reserves, below.
# See restrictive_aa.yaml for what restrict-zone and add_aa_schools do.

assignment-algorithm: DA
ctip-options:
- 1

restrict-zone: true
guard-rails: 0
# The FRL reserves of the 2026-27 runs (`+reserves_05frl`): each zone's seats
# split 50/50 between students below and above the median freelunch_prob.
# With an even split, which half lower_disadvantaged calls disadvantaged
# changes nothing.
reserve-settings: {
  "column": "freelunch_prob",
  "thresholds": "percentile:50",
  "lower_disadvantaged": true,
  "reserve_fraction": [0.5, 0.5]
  }
soft_reserve_boost: 64
non_designation_boost: 128

policies:
- Con1

priority-weights:
  promote: 1024
  ctip: 8
  sibling: 16
  zone: 4
  language-programs:
    lp-sibling: 16
    lp: 8
    sibling: 4
    ctip: 2

add_aa_schools: true
sibling-access: true
tk-access: false
designate: true
zone-building-blocks: 'attendance_area'
ties-options:
- MTB

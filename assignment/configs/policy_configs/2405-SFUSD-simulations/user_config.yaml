data:
  scenario: legacy
  overrides:
    sources:
      assignment.students:
        path: /soalnas/share/data/school_choice/Data/Cleaned/student_2324.csv
        classification: restricted
      assignment.programs:
        path: /soalnas/share/data/school_choice/Data/Cleaned/programs_facility_capicity.csv
        classification: internal
      assignment.schools:
        path: /soalnas/share/data/school_choice/Data/Cleaned/schools_rehauled_withMissionBay_2324.csv
        classification: internal
      assignment.estimate:
        path: /soalnas/share/data/school_choice/simulation-files/choice-model/estimates_2324_exp8_0604_closure.csv
        classification: restricted
      assignment.school_coordinates:
        path: /soalnas/share/data/school_choice/Data/Cleaned/schools_rehauled_withMissionBay_2324.csv
        classification: internal
      assignment.zones:
        Con1:
          path: /soalnas/share/data/school_choice/simulation-files/zones/concept1zones.csv
          classification: public
        59zone:
          path: /soalnas/share/data/school_choice/simulation-files/zones/59-zone-1_B.csv
          classification: public
        18zone_2:
          path: /soalnas/share/data/school_choice/simulation-files/zones/18-zone-1_2_BG.csv
          classification: public
        18zone_1:
          path: /soalnas/share/data/school_choice/simulation-files/zones/18-zone-1_1_BG.csv
          classification: public
        6zone-1:
          path: /soalnas/share/data/school_choice/simulation-files/zones/6-zone-1_BG.csv
          classification: public
        6zone-9_1:
          path: /soalnas/share/data/school_choice/simulation-files/zones/6-zone-9_1_BG.csv
          classification: public
        6zone-9_2:
          path: /soalnas/share/data/school_choice/simulation-files/zones/6-zone-9_2_BG.csv
          classification: public
      assignment.citywide_zones:
        18zone_1_2-BG-0point3miles:
          path: /soalnas/share/data/school_choice/simulation-files/zones/18-zone_1_2-additiona-0point3miles.txt
          classification: public
    filters:
      assignment:
        year: "2324"
        grades: [KG]
        student_population: applicant
        rounds: all
        special_programs: exclude_any_special
        capacity_profile: status_quo
        include_mission_bay: true
utility-model:
  enable: true
  list-length: 0.8*round(real_length)
  designate-lp-for-all: true
iterations:
  end: 15
  start: 0
subconfigs:
- 2405-SFUSD-simulations/simulation3_fuzzy
- 2405-SFUSD-simulations/simulation3_noFuzzy
random-seed: 2023
rounds-merged-options:
- 0
save-assignment: true
paths:
  assignment-folder: ~/assignments-facility-capacity/simulation3/

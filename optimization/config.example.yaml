# Example optimization configuration.
#   uv run python -m optimization.run optimization/config.example.yaml

# --- what to solve ---
centroids_type: '6-zone-9'
# Levels are coarse -> fine. One entry = single-shot; several = recursive.
# Switch granularity here; no manual file edits needed.
levels: ['Block_1']
solver: 'cp_int'               # cp_int | cp_bool | cp_single_zone | mip | recom | relaxed_recom | short_bursts
strategy: 'single'   # single | recursive | iterative_choice | overlapping | cutoffs | welfare | zoned_column_generation | zoned_benders
# cp_single_zone requires a centroids_type containing exactly one school ID.
# overlapping ignores centroids_type and creates one zone per eligible school.

# --- optimization parameters ---
frl_dev: 0.3
racial_dev: 0.3
overage: 0.8                     # negative disables maximum seats/student bound
shortage: 0.2                    # negative disables minimum seats/student bound
max_distance: 5
# CP/MIP: force each centroid's graph-hop neighborhood into its zone.
# cp_single_zone additionally excludes other schools' graph-hop neighborhoods.
centroid_neighbor_radius: 0
solve_time_limits: [45, 45]   # one per level
carry_over_compute: false     # recursive: add unused level time to the next level
gap_limits: [0, 0]
hints: voronoi                # voronoi | none
save_solver_logs: false       # write solver logs under output/solver_logs
save_solver_progress: false   # save improving incumbents under output/solver_progress after the run
secondary_objective: false    # cp_bool/mip: use alternative boundary objective formulation
seed: 42
workers: 8
# CP-SAT-only solver parameters. Leave unset to use OR-Tools defaults.
# linearization_level: 1
# cp_model_probing_level: 2
# symmetry_level: 2
# cp_sat_search_strategy: distance_to_centroid  # default | distance_to_centroid
# ReCom-only parameters. Negative recom_iterations uses only the solve time limit.
recom_iterations: 1000
short_bursts_length: 25
short_bursts_method: recom      # recom | relaxed_recom
# --- strategy-specific ---
boundary_radius: 2            # border width; -1 skips overlapping boundary exclusion
looseness: 1.0              # recursive: multiply constraints per configured coarser stage
boundary_prop: -1             # cutoffs/welfare/iterative_choice: 0..1; negative disables
school_solve_time_limit: 60   # overlapping: seconds for each one-worker school solve
max_iterations: 5             # iterative_choice
choice_model: 'mnl'           # iterative choice and preassignment metric: distance | mnl
choice_model_method: 'logsum' # mnl aggregation for iterative choice/metric: logsum | max
choice_utility_scale: 100     # CP-SAT integer scaling for choice objective variables
choice_utility_hints: false   # iterative_choice: seed initial MNL cuts from nearest schools
# Analytical Shi strategies have dedicated examples in
# config.example.zoned_column_generation.yaml and config.example.zoned_benders.yaml.
# cutoffs/welfare require solver: cp_bool, years: [23], and population_type: All.
cutoff_assignment_config: assignment/configs/kumar.config.yaml
cutoff_ctip_path: /share/data/school_choice/Data/2025_cleaned_data/Cleaned_new/ETB_2024.npy
cutoff_lottery_scale: 20
cutoff_gumbel_scale: 1.0
cutoff_preference_seed: 2023
remove_city_wide: false         # cutoffs/welfare: exclude citywide schools
# welfare_utility_scale: 1000000 # welfare: fixed-point utility precision
# welfare_prefix_depth: 10       # welfare: exact global recurrence through top ranks
# welfare_method: decomposition   # welfare: decomposition or direct benchmark

# --- data ingestion ---
years: [21, 22, 23]
population_type: 'GE'
capacity_scenario: 'A'
new_schools: true
include_k8: false
# graphs_dir: leave unset to use /share/data/school_choice/Zones/Optimization/Graphs.

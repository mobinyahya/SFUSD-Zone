# uv run python -m optimization.run optimization/config.example.yaml -o ./out
# Each named step independently chooses a method, objective, and constraints.
# All steps share one Dataset and its source, graph, geometry, and hint caches.
centroids_type: '6-zone-9'
method: cp_bool
objective: cut_edges
seed: 42
workers: 8
hints: voronoi                 # feasible | voronoi | none
solve_time_limits: [45]        # default seconds per step
carry_over_compute: false      # optionally transfer unused step time forward
weight_edges: false            # true: cut_edges minimizes boundary metres
save_solver_logs: false
save_solver_progress: false

constraints:
  frl_dev: 0.3
  racial_dev: 0.3
  overage: 0.8
  shortage: 0.2
  school_count_tolerance: 1
  max_distance: 5              # miles, .inf, or auto
  boundary_prop: -1            # negative disables cut-edge proportion cap
  centroid_neighbor_radius: 0

steps:
  - name: coarse
    level: Block_1
    time_limit: 45

  - name: refine
    level: Block_0
    method: cp_int
    time_limit: 45
    inputs:
      - source: coarse
        mode: hint            # warm start on every projected unit
      - source: coarse
        mode: assign          # fix only units outside the boundary band
        select: interior
        radius: 2             # release cut-edge endpoints plus two graph hops

  # Omitted inputs mean hint from the previous step; inputs: [] starts fresh.
  # Step constraints override run constraints. Any earlier step can be a source.
  # - name: welfare
  #   level: Block_0
  #   method: adaptive_short_bursts
  #   objective: matching_welfare  # requires program_population: All below
  #   time_limit: 60
  #   constraints: {overage: -1, shortage: -1}
  #   options: {short_bursts_length: 25, mid_lottery_scale: 20}
  #   inputs: [{source: refine, mode: hint}]

# Methods: cp_bool, cp_int, mip, recom, relaxed_recom, short_bursts,
# adaptive_short_bursts. Objectives: cut_edges, boundary_perimeter,
# average_distance, average_squared_distance, school_distance (legacy name),
# matching_welfare, saa_welfare, choice_welfare, capacity_match.
# Supported combinations are documented in optimization/README.md.

data:
  scenario: legacy
  overrides:
    filters:
      optimization:
        years: ['2122', '2223', '2324']
        grades: [KG]
        student_population: enrolled  # applicant | enrolled; selects annual registry sources
        rounds: all                    # or an explicit list supported by every year
        special_programs: include     # include | exclude_only_special | exclude_any_special
        program_population: GE        # GE | All | another selected program code; mid/saa require All
        capacity_scenario: programs    # programs | A | B | C | D
        include_k8: false
        include_citywide_zoning: false
        include_citywide_choice_opt: false
        include_mission_bay: true
        geography_vintage: '2020'     # 2010 | 2020
        frl_estimate: updated_2526     # updated_2526 | null (student-file FRL)
        outside_district_students: ignore  # ignore | include

# Example optimization configuration.
#   uv run python -m optimization.run optimization/config.example.yaml

# --- what to solve ---
centroids_type: '6-zone-9'
# Levels are coarse -> fine. One entry = single-shot; several = recursive.
# Switch granularity here; no manual file edits needed.
levels: ['Block_1']
solver: 'cp_int'               # cp_int | cp_bool | mip | recom | relaxed_recom | short_bursts
strategy: 'single'   # single | recursive | iterative_choice

# --- optimization parameters ---
frl_dev: 0.3
racial_dev: 0.3
overage: 0.8
shortage: 0.2
looseness: 1.0              # recursive: multiply constraints per configured coarser stage
max_distance: 5
solve_time_limits: [45, 45]   # one per level
carry_over_compute: false     # recursive: add unused level time to the next level
gap_limits: [0, 0]
hints: voronoi                # voronoi | none
save_solver_logs: false       # write solver logs under output/solver_logs
save_solver_progress: false   # save improving incumbents under output/solver_progress after the run
secondary_objective: false    # cp_bool/mip: use alternative boundary objective formulation
seed: 42
workers: 8
# CP-SAT-only solver parameters. Leave unset to use OR-Tools defaults.
# linearization_level: 1
# cp_model_probing_level: 2
# symmetry_level: 2
# cp_sat_search_strategy: distance_to_centroid  # default | distance_to_centroid
# ReCom-only parameters. Negative recom_iterations uses only the solve time limit.
recom_iterations: 1000
short_bursts_length: 25
short_bursts_method: recom      # recom | relaxed_recom
# --- strategy-specific ---
boundary_radius: 2            # recursive/iterative: how far from borders to relax
max_iterations: 5             # iterative_choice
choice_model: 'mnl'           # iterative choice and preassignment metric: distance | mnl
choice_model_method: 'logsum' # mnl aggregation for iterative choice/metric: logsum | max
choice_utility_scale: 100     # CP-SAT integer scaling for choice objective variables
choice_utility_hints: false   # iterative_choice: seed initial MNL cuts from nearest schools

# --- data ingestion ---
years: [14, 15, 16, 17, 18, 21, 22]
population_type: 'GE'
capacity_scenario: 'A'
new_schools: true
include_k8: false
# graphs_dir: leave unset to use /share/data/school_choice/Zones/Optimization/Graphs.

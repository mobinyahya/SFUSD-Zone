# Example optimization configuration.
#   uv run python -m optimization.run optimization/config.example.yaml

# --- what to solve ---
centroids_type: '6-zone-9'
# Levels are coarse -> fine. One entry = single-shot; several = recursive.
# Switch granularity here; no manual file edits needed.
levels: ['Block_1']
solver: 'cp_bool'               # cp_bool | cp_int | cp_single_zone | mip | recom | relaxed_recom | short_bursts | adaptive_short_bursts
strategy: 'single'             # single | recursive | iterative_choice | mid | mid_decomp | saa | short_bursts_choice
# cp_single_zone requires a centroids_type containing exactly one school ID.
# saa requires solver: cp_bool or mip.

# --- optimization parameters ---
frl_dev: 0.3
racial_dev: 0.3
overage: 0.8                     # negative disables maximum seats/student bound
shortage: 0.2                    # negative disables minimum seats/student bound
max_distance: 5                  # miles, or 'auto' (1.2x maximum distance to closest centroid)
# CP/MIP: force each centroid's graph-hop neighborhood into its zone.
# cp_single_zone additionally excludes other schools' graph-hop neighborhoods.
centroid_neighbor_radius: 0
solve_time_limits: [45, 45]   # one per level
carry_over_compute: false     # recursive: add unused level time to the next level
# iterative_choice/mid_decomp/saa/short_bursts_choice read the last entry as one
# total run budget instead of a per-solve limit; each iteration claims a linearly
# increasing share of what is left, so unused time carries forward.
budget_accounting: wall_clock  # wall_clock | solver_time
# wall_clock: the budget pays for everything the strategy does (problem building,
# market preprocessing, warm starts, solves, oracle/choice-model evaluation).
# solver_time: only the iterative solves are charged, so loading and evaluation
# are free and the budget measures the search itself.
gap_limits: [0, 0]
hints: voronoi                # feasible | voronoi | none
feasible_hint_time_limit: 60  # seconds for the objective-free zoning hint solve (cached per problem+seed)
save_solver_logs: false       # write solver logs under output/solver_logs
save_solver_progress: false   # save improving incumbents under output/solver_progress after the run
secondary_objective: false    # cp_bool/mip: use alternative boundary objective formulation
weight_edges: false           # weight cut edges by shared boundary length in metres
seed: 42
workers: 8
# CP-SAT-only solver parameters. Leave unset to use OR-Tools defaults.
# linearization_level: 1
# cp_model_probing_level: 2
# symmetry_level: 2
# cp_sat_search_strategy: distance_to_centroid  # default | distance_to_centroid
enumerated_solutions: -1       # positive: cp_bool/cp_int single strategy, no objective
# ReCom-only parameters. Negative recom_iterations uses only the solve time limit.
recom_iterations: -1
short_bursts_length: 25
short_bursts_method: recom      # recom | relaxed_recom
# --- strategy-specific ---
boundary_radius: 2            # recursive: graph-hop width around projected borders
looseness: 1.0              # recursive: multiply constraints per configured coarser stage
boundary_prop: -1             # single/iterative_choice/mid/mid_decomp/saa: 0..1; negative disables
max_iterations: 5             # iterative_choice/mid_decomp/saa
choice_model_method: 'logsum' # mnl aggregation for iterative choice/metric: logsum | max
choice_utility_scale: 100     # CP-SAT integer scaling for choice objective variables
choice_utility_hints: false   # iterative_choice: seed initial MNL cuts from nearest schools
mid_lottery_scale: 20         # mid/mid_decomp: integer continuum-mass grid
mid_utility_handling: omit_nonpositive  # mid/mid_decomp/saa: omit_nonpositive | exponentiate
mid_transport_bounds: true    # mid_decomp: constrain inactive tails by access and capacity
mid_complementary_slackness: false  # mid/mid_decomp: force cutoffs to 0 when demand < capacity - slack
mid_complementary_slackness_slack: 'auto'  # mid/mid_decomp: capacity slack: auto | float seats | percentage (e.g. '5%')
saa_num_seeds: 5              # saa: sampled strict-priority lotteries
saa_tie_breaking_method: MTB  # saa: MTB | STB

# --- data ingestion ---
data:
  scenario: legacy
  overrides:
    filters:
      optimization:
        years: ['2122', '2223', '2324']
        grades: [KG]
        student_population: enrolled  # applicant | enrolled; selects annual registry sources
        rounds: all                    # or an explicit list supported by every year
        special_programs: include     # include | exclude_only_special | exclude_any_special
        program_population: GE        # GE | All | another selected program code; mid/saa require All
        capacity_scenario: programs    # programs | A | B | C | D
        include_k8: false
        include_citywide: false
        include_mission_bay: true
        geography_vintage: '2020'     # 2010 | 2020
        frl_estimate: updated_2526     # updated_2526 | null (student-file FRL)
        outside_district_students: ignore  # ignore | include

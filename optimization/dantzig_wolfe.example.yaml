# Whole-zone columns; run from the project/worktree root:
# uv run python -m optimization.run optimization/dantzig_wolfe.example.yaml
strategy: dantzig_wolfe
solver: recom
centroids_type: '6-zone-9'
levels: [BlockGroup_0]
# Set [.inf] to run the complete branch-and-price search without a time cap.
# A finite budget may return FEASIBLE/UNKNOWN with an unresolved global gap.
solve_time_limits: [600]
budget_accounting: wall_clock
hints: feasible
feasible_hint_time_limit: 60
seed: 42
workers: 8
frl_dev: 0.3
racial_dev: 0.3
# Capacity constraints are retained when nonnegative. Here the MID oracle
# enforces program capacities without an aggregate seats/student restriction.
overage: -1
shortage: -1
boundary_prop: -1
dw_objective: mid             # mid (maximize welfare) | boundary (minimize cuts)
dw_recom_samples: 1000        # distinct partitions; 0 disables optional seeding
dw_recom_chains: 4
dw_recom_time_limit: 60       # bounded even when the exact search is unlimited
recom_iterations: -1          # time-limited proposals per chain
tolerance: 0.000001           # numerical pricing / absolute-gap tolerance
mid_lottery_scale: 20
mid_utility_handling: omit_nonpositive
data:
  scenario: legacy
  overrides:
    filters:
      optimization:
        years: ['2324']
        program_population: All
        include_citywide: false
        geography_vintage: '2010'
      assignment:
        year: '2324'
        geography_vintage: '2010'

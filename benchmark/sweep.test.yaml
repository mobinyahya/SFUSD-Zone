# Optimization-native benchmark sweep.
# Run: uv run python -m benchmark.run benchmark/sweep.test.yaml

name: recursive-blockgroup-sweep
mode: run  # run | metrics

optimization_defaults:
  centroids_type: '6-zone-3'
  levels: ['BlockGroup_1']
  solver: 'cp_bool'
  strategy: 'single'
  frl_dev: 0.3
  racial_dev: 0.3
  overage: 0.8
  shortage: 0.2
  max_distance: 5
  solve_time_limits: [45]
  gap_limits: [0]
  hints: gerry_chain
  seed: 42
  workers: 8
  years: [14, 15, 16, 17, 18, 21, 22]
  population_type: 'GE'
  capacity_scenario: 'A'
  new_schools: true
  include_k8: false
  level_to_split: {1: 2, 2: 1}

sweep:
  seed: [42, 12]

execution:
  output_dir: './optimization_output'
  capacity: 32              # total solver-thread slots available on the machine
  max_workers: 5            # max concurrent Python worker processes
  max_tasks_per_worker: 25  # recycle processes to limit memory growth
  skip_existing: true
  rerun_failed: true
  sequential: false

metrics:
  strict: true
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

# Optional student-assignment matching simulation.
# Run matching independently with:
#   uv run python -m benchmark.run benchmark/sweep.test.yaml --mode matching
matching:
  enabled: true
  config: benchmark/matching/medium_zones_no_reserves_no_sib.yaml

# Optional assignment-based choice metrics. These use matching assignment CSVs,
# do nothing when no assignments exist, and can be run independently with:
#   uv run python -m benchmark.run benchmark/sweep.test.yaml --mode choice_metrics
choice_metrics:
  enabled: true

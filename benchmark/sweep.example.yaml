# Optimization-native benchmark sweep.
# Run: uv run python -m benchmark.run benchmark/sweep.example.yaml

name: recursive-blockgroup-sweep
mode: run  # run | metrics

optimization_defaults:
  centroids_type: '7-zone-14'
  levels: ['BlockGroup_1', 'BlockGroup_0']
  solver: 'cp_int'
  strategy: 'recursive'
  frl_dev: 0.3
  racial_dev: 0.3
  overage: 0.8
  shortage: 0.2
  looseness: 1.0              # recursive: multiply constraints per configured coarser stage
  max_distance: 5
  solve_time_limits: [45, 60]
  carry_over_compute: false    # recursive: add unused level time to the next level
  gap_limits: [0, 0]
  hints: voronoi
  save_solver_logs: false     # write solver logs under solver_logs/
  save_solver_progress: false # save improving incumbents under solver_progress/
  weight_edges: false         # weight cut edges by shared boundary length in metres
  seed: 42
  workers: 8
  # CP-SAT-only solver parameters. Leave unset to use OR-Tools defaults.
  # linearization_level: 1
  # cp_model_probing_level: 2
  # symmetry_level: 2
  data:
    scenario: legacy
    overrides:
      sources:
        optimization.schools: optimization.schools.current
      filters:
        optimization:
          years: ["1415", "1516", "1617", "1718", "1819", "2122", "2223"]
          grades: [KG]
          student_population: enrolled
          rounds: all
          special_programs: include
          program_population: GE
          capacity_scenario: programs
          include_k8: false
          include_citywide: false
          include_mission_bay: true
          geography_vintage: "2010"
          frl_estimate: null
          outside_district_students: ignore

sweep:
  centroids_type: ['5-zone-AF', '6-zone-3']
  frl_dev: [0.12, 0.15, 0.2, 0.25]
  racial_dev: [0.12, 0.15, 0.2, 0.25]
  seed: [42, 14, 20]
  overage: [0.7, 0.8, 0.9]
  shortage: [0.15, 0.2, 0.25]

execution:
  output_dir: './optimization_output'
  capacity: 32              # total solver-thread slots available on the machine
  max_workers: 5            # max concurrent Python worker processes
  max_tasks_per_worker: 25  # recycle processes to limit memory growth
  skip_existing: true
  rerun_failed: true
  sequential: false

metrics:
  strict: true
  compute_stage_metrics: false  # opt in to cut-edge/compactness metrics for every saved stage
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

# Optional maps for every benchmark zoning. Existing PNGs are reused on skipped
# runs; content-addressed geometry artifacts are shared locally and on Slurm.
visualization:
  enabled: false
  stages: final  # final | all
  # artifact_dir: '/shared/path/to/visualization-cache'

# Optional student assignment. The complete base config selects policy
# subconfigs and controls aggregate/local metric exports.
# Run assignment independently with:
#   uv run python -m benchmark.run benchmark/sweep.example.yaml --mode matching
# matching:
#   enabled: true
#   config: ../assignment/configs/8-19-choice.yaml
#   compute_stage_assignments: false

# Optimization-native benchmark sweep.

name: full_benchmark_v1
mode: run  # run | metrics

optimization_defaults:
  data:
    scenario: summer-26-zoning
    overrides: {}
  save_solver_logs: true
  save_solver_progress: false
  max_distance: 3.1

  racial_dev: -1
  overage: 0.2
  shortage: 0.2
  frl_dev: 0.15
  # boundary_prop: 0.18
  hints: voronoi
  strategy: 'single'
  solve_time_limits: [600]
  # boundary_radius: 1
  gap_limits: [0]
  workers: 8
  centroid_neighbor_radius: 0
  recom_iterations: -1
  seed: 42
  # cp_sat_search_strategy: distance_to_centroid

sweep:
  centroids_type: ['6-zone-9', '8-zone-22', '10-zone-3',  '13-zone-6', '18-zone-1']
  levels: ['Block_0']

tasks:
  - solver: 'cp_bool'
  - solver: 'recom'
  - solver: 'relaxed_recom'
  - solver: 'short_bursts'
    short_bursts_method: relaxed_recom
  - solver: 'short_bursts'
    short_bursts_method: recom



execution:
  output_dir: '/soalnas/share/data/school_choice/local_runs/benchmark_v1'
  skip_existing: true
  rerun_failed: true
  sequential: false

metrics:
  strict: true
  compute_stage_metrics: false
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

visualization:
  enabled: false
  stages: final  # final | all


matching:
  enabled: false
  config: ../../assignment/configs/choice-zone-only-for-benchmark.yaml
  compute_stage_assignments: false

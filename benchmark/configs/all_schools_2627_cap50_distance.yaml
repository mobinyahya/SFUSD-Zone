# All-schools (59-zone) 2026-27 study, capacity-balanced, round 5: school distance.
#
# Same constraints and warm starts as all_schools_2627_cap50_perimeter.yaml, but
# the objective is sum_n w_n * d(n, school of n's zone)^2 (miles^2), with
# w_n = 0.75 * area share + 0.25 * student share. A ribbon's far end is far from
# its school, so this penalizes ribbons directly, coastline or not.
#
# Run: uv run python -m benchmark.slurm submit --config benchmark/configs/all_schools_2627_cap50_distance.yaml
#
name: all_schools_2627_cap50_distance
mode: run

optimization_defaults:
  data:
    scenario: sfusd-2627
    overrides:
      filters:
        optimization:
          student_population: enrolled
          include_mission_bay: true
          geography_vintage: "2020"
  centroids_type: '59-zone'
  strategy: single
  levels: ['Block_0']
  solve_time_limits: [3600]
  save_solver_logs: true
  save_solver_progress: false
  max_distance: auto

  frl_dev: 0.3
  racial_dev: -1
  overage: 0.5
  shortage: 0.5
  boundary_prop: -1

  school_distance_area_weight: 0.75
  school_distance_student_weight: 0.25
  seed: 1

tasks:
  # --- cp_bool, warm-started from the round-4 maps ---
  - &cp
    solver: cp_bool
    workers: 8
    compactness_objective: school_distance
    hints: voronoi          # fallback only; hint_zoning takes precedence
    hint_zoning: '/soalnas/share/data/school_choice/local_runs/all_schools_2627_cap50_r4/59-zone/seed1/frl0.3_racial1/overage0.5_shortage0.5/single_cp_bool_Block_0_tl_3600_ac312ada/zone_dict_area_Block_0.json'
  - <<: *cp
    seed: 2
  - <<: *cp
    hint_zoning: '/soalnas/share/data/school_choice/local_runs/all_schools_2627_cap50_r4/59-zone/seed1/frl0.3_racial1/overage0.5_shortage0.5/single_cp_bool_Block_0_tl_3600_077a5ef1/zone_dict_area_Block_0.json'

  # --- adaptive short bursts, exactly one school per zone, 1 core ---
  - &asb
    solver: recom
    workers: 1
    school_count_tolerance: 0
    hints: voronoi
    recom_iterations: -1
    recom_objective: school_distance
    recom_burst_length: 25
    hint_zoning: '/soalnas/share/data/school_choice/local_runs/all_schools_2627_cap50_r4/59-zone/seed1/frl0.3_racial1/overage0.5_shortage0.5/single_cp_bool_Block_0_tl_3600_ac312ada/zone_dict_area_Block_0.json'
    seed: 1
  - <<: *asb
    seed: 2
  - <<: *asb
    hint_zoning: null
    seed: 1
  - <<: *asb
    hint_zoning: null
    seed: 2

execution:
  output_dir: '/soalnas/share/data/school_choice/local_runs/all_schools_2627_cap50_distance'
  skip_existing: true
  rerun_failed: true
  sequential: false

metrics:
  strict: true
  compute_stage_metrics: false
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

visualization:
  enabled: true
  stages: final

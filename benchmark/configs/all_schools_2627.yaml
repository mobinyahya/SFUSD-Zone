# All-schools zoning (59 zones, one per school incl. Mission Bay) on the
# 2026-27 enrolled kindergarten cohort, 2020 Census blocks.
#
# Constraints: school count (always on: every zone holds avg +/- 1 schools),
# contiguity, and FRL share within 0.30 of the district. Racial, capacity, and
# cut-edge rows are off. Objective is the default cut-edge (boundary) count.
#
# Three families, each given about an hour:
#   * cp_bool single-level at Block_0 (8 cores)
#   * cp_bool recursive Block_1 -> Block_0 (and one Block_2 -> Block_1 -> Block_0),
#     looseness 1.1 (coarse levels get FRL 0.33 / 0.363), boundary radius 0 or 1
#   * adaptive short bursts at Block_0 from a Voronoi start (1 core)
#
# Run: uv run python -m benchmark.slurm submit --config benchmark/configs/all_schools_2627.yaml
#
name: all_schools_2627_v1
mode: run  # run | metrics

optimization_defaults:
  data:
    scenario: sfusd-2627
    overrides:
      filters:
        optimization:
          student_population: enrolled
          include_mission_bay: true
          geography_vintage: "2020"
  centroids_type: '59-zone'
  solver: cp_bool
  save_solver_logs: true
  save_solver_progress: false
  max_distance: auto

  frl_dev: 0.3
  racial_dev: -1
  overage: -1
  shortage: -1
  boundary_prop: -1

  hints: feasible
  feasible_hint_time_limit: 900
  workers: 8

tasks:
  # --- cp_bool, single level at Block_0 ---
  - strategy: single
    levels: ['Block_0']
    solve_time_limits: [3600]
    seed: 1
  - strategy: single
    levels: ['Block_0']
    solve_time_limits: [3600]
    seed: 2
  - strategy: single
    levels: ['Block_0']
    solve_time_limits: [3600]
    hints: voronoi
    seed: 1

  # --- cp_bool, recursive Block_1 -> Block_0 ---
  - strategy: recursive
    levels: ['Block_1', 'Block_0']
    solve_time_limits: [1800, 1800]
    looseness: 1.1
    boundary_radius: 0
    seed: 1
  - strategy: recursive
    levels: ['Block_1', 'Block_0']
    solve_time_limits: [1800, 1800]
    looseness: 1.1
    boundary_radius: 1
    seed: 1
  - strategy: recursive
    levels: ['Block_1', 'Block_0']
    solve_time_limits: [1800, 1800]
    looseness: 1.1
    boundary_radius: 1
    seed: 2
  - strategy: recursive
    levels: ['Block_1', 'Block_0']
    solve_time_limits: [1800, 1800]
    looseness: 1.0
    boundary_radius: 1
    seed: 1
  - strategy: recursive
    levels: ['Block_2', 'Block_1', 'Block_0']
    solve_time_limits: [1200, 1200, 1200]
    looseness: 1.1
    boundary_radius: 1
    seed: 1

  # --- adaptive short bursts at Block_0, 1 core ---
  - &asb
    strategy: single
    solver: recom
    levels: ['Block_0']
    solve_time_limits: [3600]
    hints: voronoi
    workers: 1
    recom_iterations: -1
    recom_objective: cut_edges
    recom_burst_length: 25
    seed: 1
  - <<: *asb
    seed: 2
  - <<: *asb
    recom_burst_length: 100
    seed: 1
  - <<: *asb
    recom_burst_length: 100
    seed: 2

execution:
  output_dir: '/soalnas/share/data/school_choice/local_runs/all_schools_2627_v1'
  skip_existing: true
  rerun_failed: true
  sequential: false

metrics:
  strict: true
  compute_stage_metrics: false
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

visualization:
  enabled: true
  stages: final

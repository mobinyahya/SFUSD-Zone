# Cross-evaluation of every seed-1 11-18 map on the Nov 13 ideal baseline.
#
# As 11-18_crosseval_nov13.yaml, but with the maps 11-18 drew for all four Nov 13
# populations (applied_or_enrolled, enrolled_all, applicant, enrolled; 4 policies
# x 5 FRL weights each = 80 maps), plus today's 2013 attendance areas, scored and
# matched under every Nov 13 population and every matching policy:
# 81 x 4 x 4 = 1,296 runs. The 656 runs of 11-18_crosseval_nov13.yaml are a
# subset with the same task ids.
#
# Run: uv run python -m benchmark.slurm submit --config benchmark/configs/attendance_areas/11-18_crosseval_nov13_all_pops.yaml

name: attendance_areas_11-18_crosseval_nov13_all_pops
mode: run
optimization_defaults:
  centroids_type: all
  hints: voronoi
  workers: 1
  save_solver_logs: false
  save_solver_progress: false
  mid_preference_source: stated
  capacity_match_unassigned_weight: 1
  capacity_match_designated_weight: 0
sweep:
  data:
  - scenario: attendance-areas-2627
    overrides:
      filters:
        optimization:
          capacity_scenario: ideal_baseline_nov_13_2026
          student_population: applied_or_enrolled
        assignment:
          capacity_scenario: ideal_baseline_nov_13_2026
          student_population: applied_or_enrolled
  - scenario: attendance-areas-2627
    overrides:
      filters:
        optimization:
          capacity_scenario: ideal_baseline_nov_13_2026
          student_population: applicant
        assignment:
          capacity_scenario: ideal_baseline_nov_13_2026
          student_population: applicant
  - scenario: attendance-areas-2627
    overrides:
      filters:
        optimization:
          capacity_scenario: ideal_baseline_nov_13_2026
          student_population: enrolled
        assignment:
          capacity_scenario: ideal_baseline_nov_13_2026
          student_population: enrolled
  - scenario: attendance-areas-2627
    overrides:
      filters:
        optimization:
          capacity_scenario: ideal_baseline_nov_13_2026
          student_population: enrolled_all
        assignment:
          capacity_scenario: ideal_baseline_nov_13_2026
          student_population: enrolled_all

# Cross-evaluation of 11-18 maps on the Nov 13 ideal baseline.
#
# Every seed-1 map 11-18 drew for the Nov 13 baseline with the applied_or_enrolled
# or enrolled_all population (2 populations x 4 policies x 5 FRL weights = 40
# maps), plus today's 2013 attendance areas, is scored and matched unchanged
# under every Nov 13 population (applicant, applied_or_enrolled, enrolled,
# enrolled_all) and every matching policy: 41 x 4 x 4 = 656 runs.
#
# Each run reads its map exactly (hint_zoning, zero ReCom moves at Block_0,
# every constraint off, as 11-18's current_aa row does) and is matched under
# its own task's policy with 25 lotteries. Metrics only: no heatmaps or run
# maps. A run's source map is its config's hint_zoning; the sources all share
# the Nov 13 baseline's 59 attendance-area schools, so zones line up.
#
# Run: uv run python -m benchmark.slurm submit --config benchmark/configs/attendance_areas/11-18_crosseval_nov13.yaml

name: attendance_areas_11-18_crosseval_nov13
mode: run
optimization_defaults:
  centroids_type: all
  hints: voronoi
  workers: 1
  save_solver_logs: false
  save_solver_progress: false
  mid_preference_source: stated
  capacity_match_unassigned_weight: 1
  capacity_match_designated_weight: 0
sweep:
  data:
  - scenario: attendance-areas-2627
    overrides:
      filters:
        optimization:
          capacity_scenario: ideal_baseline_nov_13_2026
          student_population: applied_or_enrolled
        assignment:
          capacity_scenario: ideal_baseline_nov_13_2026
          student_population: applied_or_enrolled
  - scenario: attendance-areas-2627
    overrides:
      filters:
        optimization:
          capacity_scenario: ideal_baseline_nov_13_2026
          student_population: applicant
        assignment:

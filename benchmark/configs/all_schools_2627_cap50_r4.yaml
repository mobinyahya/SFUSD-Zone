# All-schools (59-zone) 2026-27 study, capacity-balanced, round 4: cross-seeding.
#
# On the real (cluster) cohort, pinned cp_bool finds nothing from scratch: at
# Block_0.5 the capacity band, FRL band, and the closer-neighbour (star-shaped)
# contiguity rule are jointly infeasible, and Block_0 stays UNKNOWN for an hour.
# Adaptive short bursts with exactly one school per zone
# (all_schools_2627_cap50_asb.yaml) reached 2,734 / 2,754 cut edges at
# temperature 1.3. Relabelled so each zone carries its school's centroid index,
# those maps break only 9 blocks' closer-neighbour rule and 5 blocks'
# max_distance candidacy, so they are near-feasible cp_bool warm starts.
#
# The hint files live in all_schools_2627_hints/ (zone labels = 59-zone order).
#
# Run: uv run python -m benchmark.slurm submit --config benchmark/configs/all_schools_2627_cap50_r4.yaml
#
name: all_schools_2627_cap50_r4
mode: run

optimization_defaults:
  data:
    scenario: sfusd-2627
    overrides:
      filters:
        optimization:
          student_population: enrolled
          include_mission_bay: true
          geography_vintage: "2020"
  centroids_type: '59-zone'
  strategy: single
  levels: ['Block_0']
  solve_time_limits: [3600]
  save_solver_logs: true
  save_solver_progress: false
  max_distance: auto

  frl_dev: 0.3
  racial_dev: -1
  overage: 0.5
  shortage: 0.5
  boundary_prop: -1

  seed: 1

tasks:
  # --- cp_bool, warm-started from the relabelled short-bursts maps ---
  - &cp
    solver: cp_bool
    workers: 8
    hints: voronoi          # fallback only; hint_zoning takes precedence
    hint_zoning: '/soalnas/share/data/school_choice/local_runs/all_schools_2627_hints/zone_dict_area_Block_0_asb2734_relabelled.json'
  - <<: *cp
    max_distance: .inf
  - <<: *cp
    hint_zoning: '/soalnas/share/data/school_choice/local_runs/all_schools_2627_hints/zone_dict_area_Block_0_asb2754_relabelled.json'
  - <<: *cp
    hint_zoning: '/soalnas/share/data/school_choice/local_runs/all_schools_2627_hints/zone_dict_area_Block_0_asb2754_relabelled.json'
    max_distance: .inf

  # --- adaptive short bursts, exactly one school per zone, 1 core ---
  - &asb
    solver: recom
    workers: 1
    school_count_tolerance: 0
    hints: voronoi
    recom_iterations: -1
    recom_objective: cut_edges
    recom_burst_length: 25
    seed: 3
  - <<: *asb
    seed: 4
  - <<: *asb
    recom_burst_length: 50
    seed: 3
  # continue from the 2,734 map
  - <<: *asb
    hint_zoning: '/soalnas/share/data/school_choice/local_runs/all_schools_2627_hints/zone_dict_area_Block_0_asb2734_relabelled.json'
    seed: 1
  - <<: *asb
    hint_zoning: '/soalnas/share/data/school_choice/local_runs/all_schools_2627_hints/zone_dict_area_Block_0_asb2734_relabelled.json'
    seed: 2

execution:
  output_dir: '/soalnas/share/data/school_choice/local_runs/all_schools_2627_cap50_r4'
  skip_existing: true
  rerun_failed: true
  sequential: false

metrics:
  strict: true
  compute_stage_metrics: false
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

visualization:
  enabled: true
  stages: final

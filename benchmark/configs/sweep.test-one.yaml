# Optimization-native benchmark sweep.

name: one-zone
mode: run  # run | metrics

optimization_defaults:
  save_solver_logs: true
  strategy: single
  solve_time_limits: [300]
  hints: voronoi
  levels: [Block_0]
  racial_dev: -1
  workers: 8
  centroids_type:  1-zone-example
  frl_dev: 0.15
  overage: 0.15
  shortage: 0.15
  centroid_neighbor_radius: 1

sweep:
  seed: [42, 14, 33]

tasks:
  - solver: 'cp_bool'

execution:
  output_dir: '/share/data/school_choice/local_runs/test_single_solver_2/'
  capacity: 5             # total solver-thread slots available on the machine
  max_workers: 8            # max concurrent Python worker processes
  max_tasks_per_worker: 25  # recycle processes to limit memory growth
  skip_existing: false
  rerun_failed: true
  sequential: false

metrics:
  strict: true
  compute_stage_metrics: false
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

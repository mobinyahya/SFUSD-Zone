# Optimization-native benchmark sweep.

name: sfusd_8_21
mode: run  # run | metrics

optimization_defaults:
  data:
    scenario: summer-26-zoning
    overrides: {}
  save_solver_logs: true
  save_solver_progress: false
  max_distance: 3.1
  boundary_prop: 0.18
  hints: voronoi
  racial_dev: -1
  overage: -1
  shortage: -1
  frl_dev: 0.15
  strategy: 'saa'
  max_iterations: 15 
  levels: ['Block_2']
  solve_time_limits: [300]
  # boundary_radius: 1
  gap_limits: [0]
  workers: 40
  centroid_neighbor_radius: 0
  # cp_sat_search_strategy: distance_to_centroid
  solver: 'cp_bool'
  mid_utility_handling: omit_nonpositive
  saa_num_seeds: 10
  saa_tie_breaking_method: MTB

sweep:
  centroids_type: ['6-zone-9']
  seed: [0]

execution:
  output_dir: '/soalnas/share/data/school_choice/local_runs/saa_test_v1'
  skip_existing: true
  rerun_failed: true
  sequential: false

metrics:
  strict: true
  compute_stage_metrics: true
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

visualization:
  enabled: true
  stages: final  # final | all


matching:
  enabled: true
  config: ../../assignment/configs/choice-zone-only-for-benchmark.yaml
  compute_stage_assignments: false

# Optimization-native benchmark sweep.

name: sfusd_8_21
mode: run  # run | metrics

optimization_defaults:
  data:
    scenario: summer-26-zoning
    overrides: {}
  save_solver_logs: false
  save_solver_progress: false
  max_distance: 5
  hints: voronoi
  racial_dev: -1
  looseness: 1.25
  strategy: 'recursive'
  levels: ['Block_2', 'Block_1']
  solve_time_limits: [400, 800]
  boundary_radius: 2
  gap_limits: [0, 0]
  workers: 8
  centroid_neighbor_radius: 0
  cp_sat_search_strategy: distance_to_centroid
  solver: 'cp_bool'

sweep:
  centroids_type: ['13-zone-6',  '13-zone-7', '13-zone-5', '18-zone-1', '18-zone-2', '18-zone-3']
  frl_dev: [0.15]
  seed: [0, 1, 2, 3, 4, 5, 6, 7]
  # ignoring racial deviations
  overage: [0.15, 0.2,  -1]
  shortage: [0.15, 0.2, -1]


execution:
  output_dir: '/soalnas/share/data/school_choice/local_runs/sfusd_8_21_v1'
  skip_existing: true
  rerun_failed: true
  sequential: false

metrics:
  strict: true
  compute_stage_metrics: false
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

visualization:
  enabled: true
  stages: final  # final | all


matching:
  enabled: true
  config: ../../assignment/configs/8-18-real-pref-zone-only.yaml
  compute_stage_assignments: false
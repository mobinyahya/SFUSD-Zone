# Smoke test for the exact sampled-matching strategy.
#
# One sample and a short budget: the point is to confirm the model builds on the
# real market, the zoning block and the matching block agree on the access
# structure, and Gurobi returns a zoning -- not to close the gap. Each extra
# seed is another 2|Gamma| binaries (|Gamma| is about 12,000 on Block_2), so
# raise stable_cutoff_num_seeds only alongside the time limit.
#
# hints: feasible is not optional here. A mid run with hints: voronoi once spent
# 14,400s without finding a single feasible zoning on this instance while every
# feasible-hint run returned one, and this strategy's incumbent comes from the
# same zoning block.

name: stable_cutoff_test
mode: run  # run | metrics

optimization_defaults:
  data:
    scenario: summer-26-zoning
    overrides: {}
  save_solver_logs: true
  save_solver_progress: false
  max_distance: 3.1
  boundary_prop: 0.18
  hints: feasible
  feasible_hint_time_limit: 300

  racial_dev: -1
  overage: -1
  shortage: -1
  frl_dev: 0.15

  strategy: 'stable_cutoff'
  levels: ['Block_2']
  solve_time_limits: [600]
  gap_limits: [0]
  workers: 8
  centroid_neighbor_radius: 0
  solver: 'mip'

  mid_utility_handling: omit_nonpositive
  stable_cutoff_num_seeds: 1
  stable_cutoff_tie_breaking_method: STB
  stable_cutoff_non_wastefulness: true
  stable_cutoff_aggregate_stability: true

sweep:
  centroids_type: ['6-zone-3']
  seed: [0]

execution:
  output_dir: '/soalnas/share/data/school_choice/local_runs/stable_cutoff_test_v1'
  skip_existing: true
  rerun_failed: true
  sequential: false

metrics:
  strict: true
  compute_stage_metrics: false
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

visualization:
  enabled: false
  stages: final  # final | all

matching:
  enabled: false
  config: ../../assignment/configs/choice-zone-only-for-benchmark.yaml
  compute_stage_assignments: false

# Optimization-native benchmark sweep.

name: sfusd_8_21
mode: run  # run | metrics

optimization_defaults:
  data:
    scenario: summer-26-zoning
    overrides: {}
  save_solver_logs: false
  save_solver_progress: false
  max_distance: 3
  boundary_prop: 0.18
  hints: voronoi
  racial_dev: -1
  overage: -1
  shortage: -1
  frl_dev: 0.15
  strategy: 'single'
  enumerated_solutions: 1000
  levels: ['Block_2']
  solve_time_limits: [30]
  # boundary_radius: 1
  gap_limits: [0]
  workers: 1
  centroid_neighbor_radius: 0
  # cp_sat_search_strategy: distance_to_centroid
  solver: 'cp_bool'

sweep:
  centroids_type: ['6-zone-9']
  seed: [0]


execution:
  output_dir: './benchmark_output/test_feasible_7'
  skip_existing: true
  rerun_failed: true
  sequential: false

metrics:
  strict: true
  compute_stage_metrics: false
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

visualization:
  enabled: true
  stages: all  # final | all


matching:
  enabled: false
  config: ../../assignment/configs/8-18-real-pref-zone-only.yaml
  compute_stage_assignments: false
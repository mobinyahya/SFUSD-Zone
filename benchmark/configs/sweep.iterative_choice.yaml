name: iterative-choice
mode: run

optimization_defaults:
  levels: ['Block_1']     # use ['BlockGroup_0'] for full fine-grained test
  strategy: 'iterative_choice'
  linearization_level: 2

  frl_dev: 0.15
  racial_dev: -1
  overage: 0.3
  shortage: 0.15
  max_distance: 4

  solve_time_limits: [200]
  hints: voronoi
  workers: 4

  max_iterations: 15
  tolerance: 0

  choice_model: 'mnl'
  choice_utility_scale: 100.0
  choice_utility_hints: true
  solver: 'cp_bool'

sweep:
  centroids_type: ['6-zone-3',  '8-zone-24',  '10-zone-3', '13-zone-5']

tasks:
  - choice_model_method: 'logsum'
    workers: 8
  - strategy: 'single'
    seed: 1
  - strategy: 'single'
    seed: 2
  - strategy: 'single'
    seed: 3
  - strategy: 'single'
    seed: 4
  - strategy: 'single'
    seed: 5
  - strategy: 'single'
    seed: 6
  - strategy: 'single'
    seed: 7
  - strategy: 'single'
    seed: 8
  - strategy: 'single'
    seed: 9
  - strategy: 'single'
    seed: 10
  - strategy: 'single'
    seed: 11
  - strategy: 'single'
    seed: 12
  - strategy: 'single'
    seed: 13
  - strategy: 'single'
    seed: 14
  - strategy: 'single'
    seed: 15

execution:
  output_dir: '/share/data/school_choice/local_runs/iterative_choice_updated_8'
  capacity: 40
  max_workers: 20
  max_tasks_per_worker: 5
  skip_existing: true
  rerun_failed: true
  sequential: false

metrics:
  strict: true
  compute_stage_metrics: false
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

matching:
  enabled: true
  configs:
    - name: sd
      config: benchmark/matching/sd.yaml
    - name: no_reserves
      config: benchmark/matching/zones+no_reserves.yaml
    - name: soft_reserves
      config: benchmark/matching/zones+soft_reserves_06frl.yaml
    - name: hard_reserves
      config: benchmark/matching/zones+hard_reserves_06frl.yaml
  compute_stage_assignments: true

choice_metrics:
  enabled: true
  compute_stage_metrics: true

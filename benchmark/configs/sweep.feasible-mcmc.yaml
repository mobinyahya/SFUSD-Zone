# Optimization-native benchmark sweep.

name: feasible-mcmc
mode: run  # run | metrics

optimization_defaults:
  save_solver_progress: true
  save_solver_logs: true
  racial_dev: -1
  frl_dev: 0.15
  levels: [Block_1]

  solve_time_limits: [900]
  overage: 0.3
  workers: 1
  hints: voronoi
  strategy: single

  recom_iterations: -1
  recom_cut_attempts: 10
  recom_population_epsilon: 0.15
  recom_balance_metric: num_schools
  relaxed_recom_min_boundary_edges: 0
  recom_temperature: 0.0
  short_bursts_length: 25

sweep:
  centroids_type: ['4-zone-rec-4', '5-zone-AF', '6-zone-3', '8-zone-22']
  shortage: [0.15, 0.2, 0.25]
  seed: [1, 2, 3]

tasks:
  - solver: 'relaxed_recom'
  - solver: 'short_bursts_recom'


execution:
  output_dir: '/share/data/school_choice/local_runs/feasible_mcmc_3/'
  capacity: 48             # total solver-thread slots available on the machine
  max_workers: 50           # max concurrent Python worker processes
  max_tasks_per_worker: 10  # recycle processes to limit memory growth
  skip_existing: true
  rerun_failed: true
  sequential: false

metrics:
  strict: true
  compute_stage_metrics: false
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

matching:
  enabled: false
  compute_stage_assignments: false

choice_metrics:
  enabled: false
  compute_stage_metrics: false

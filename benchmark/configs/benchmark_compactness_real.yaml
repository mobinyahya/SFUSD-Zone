execution:
  output_dir: '/soalnas/share/data/school_choice/local_runs/benchmark_compactness_v1'
  skip_existing: true
  rerun_failed: true
  sequential: false

metrics:
  strict: true
  compute_stage_metrics: false
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

visualization:
  enabled: false            # maps were rendered by the original sweep
  stages: final

matching:
  enabled: true
  config: ../../assignment/configs/benchmark_capacity_match_assignment.yaml
  compute_stage_assignments: false
  assignment_dir: assignments

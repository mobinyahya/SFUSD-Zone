# Optimization-native benchmark sweep.

name: sfusd_zone_test
mode: run  # run | metrics

optimization_defaults:
  carry_over_compute: true
  max_distance: 4.52
  hints: voronoi
  racial_dev: -1
  looseness: 1.25
  gap_limits: [0, 0, 0]
  workers: 8
  solver: 'cp_bool'

sweep:
  centroids_type: ['6-zone-3', '6-zone-9', '8-zone-22', '8-zone-24', '10-zone-3', '10-zone-11', '10-zone-9', '13-zone-5', '13-zone-6','13-zone-7', '18-zone-1', '18-zone-6', '18-zone-3']
  frl_dev: [0.13, 0.14, 0.15]
  # ignoring racial deviations
  overage: [0.15, 0.2, 0.25]
  shortage: [0.15, 0.2, 0.25]

tasks:
  - strategy: 'single'
    levels: ['Block_0']
    solve_time_limits: [1200]

  - strategy: 'recursive'
    levels: ['Block_2', 'Block_0']
    solve_time_limits: [400, 800]
    boundary_radius: 2
  
  - strategy: 'recursive'
    levels: ['Block_1', 'Block_0']
    solve_time_limits: [600, 600]
    boundary_radius: 1

  - strategy: 'recursive'
    levels: ['Block_3', 'Block_0']
    solve_time_limits: [400, 800]
    boundary_radius: 2


execution:
  output_dir: '/share/data/school_choice/local_runs/sfusd_zone_test_3/'
  capacity: 48              # total solver-thread slots available on the machine
  max_workers: 10           # max concurrent Python worker processes
  max_tasks_per_worker: 10  # recycle processes to limit memory growth
  skip_existing: true
  rerun_failed: true
  sequential: false

metrics:
  strict: true
  compute_stage_metrics: false
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

matching:
  enabled: true
  configs:
    - name: no_reserves
      config: benchmark/matching/zones+no_reserves.yaml
    - name: soft_reserves
      config: benchmark/matching/zones+soft_reserves_06frl.yaml
    - name: hard_reserves
      config: benchmark/matching/zones+hard_reserves_06frl.yaml
  compute_stage_assignments: false

choice_metrics:
  enabled: true
  compute_stage_metrics: false

name: iterative-choice-utility-test
mode: run

optimization_defaults:
  centroids_type: '6-zone-3'
  levels: ['BlockGroup_0']     # use ['BlockGroup_0'] for full fine-grained test
  solver: 'cp_bool'
  strategy: 'iterative_choice'

  frl_dev: 0.3
  racial_dev: -1
  overage: 0.9
  shortage: 0.3
  max_distance: 4

  solve_time_limits: [120]
  gap_limits: [0]
  hints: voronoi
  seed: 42
  workers: 24

  max_iterations: 50
  tolerance: 0

  choice_model: 'mnl'
  choice_model_method: 'logsum'
  choice_utility_scale: 100.0

  data:
    scenario: legacy
    overrides:
      sources:
        optimization.schools: optimization.schools.current
      filters:
        optimization:
          years: ["1415", "1516", "1617", "1718", "1819", "2122", "2223"]
          grades: [KG]
          student_population: enrolled
          rounds: all
          special_programs: include
          program_population: GE
          capacity_scenario: A
          include_k8: false
          include_citywide: false
          include_mission_bay: true

sweep:
  seed: [42]

execution:
  output_dir: '/share/data/school_choice/local_runs/iterative_choice_test_mnl'
  capacity: 40
  max_workers: 1
  max_tasks_per_worker: 5
  skip_existing: true
  rerun_failed: true
  sequential: true

metrics:
  strict: true
  compute_stage_metrics: false
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

matching:
  enabled: true
  config: benchmark/matching/sd.yaml
  compute_stage_assignments: true

choice_metrics:
  enabled: true
  compute_stage_metrics: true

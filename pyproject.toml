[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sfusd-zone"
version = "0.1.0"
description = "Creating zones for SFUSD"
requires-python = ">=3.13"
dependencies = [
    "adjusttext>=1.4.0",
    "click>=8.3.1",
    "descartes>=1.1.0",
    "geopandas>=1.1.2",
    "gurobipy>=13.0.0",
    "hydra-core>=1.3.4",
    "kahip>=3.22",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "numpy>=2.4.0",
    "omegaconf>=2.3.1",
    "openpyxl>=3.1.5",
    "ortools==9.14.6206",
    "pandas>=2.3.3",
    "pandas-stubs~=2.3.3",
    "pyyaml>=6.0.3",
    "ruff>=0.15.20",
    "rules>=3.5",
    "scikit-learn>=1.8.0",
    "scipy>=1.18.0",
    "scipy-stubs~=1.16.3",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "tqdm>=4.69.0",
    "yamale>=6.1.0",
]

[project.scripts]
sfusd-match = "assignment.student_assignment.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
markers = [
    "real_data: requires prebuilt SFUSD graph caches",
]

[tool.setuptools.packages.find]
include = [
    "assignment",
    "assignment.student_assignment*",
    "Config*",
    "choice*",
    "optimization*",
    "metrics*",
    "benchmark*",
    "redistricting*",
]

[tool.setuptools.package-data]
Config = ["*.yaml"]
optimization = ["*.yaml"]
benchmark = ["*.yaml", "configs/*.yaml"]
"benchmark.matching" = ["*.yaml"]

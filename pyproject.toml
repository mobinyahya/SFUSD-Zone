[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sfusd-zone"
version = "0.1.0"
description = "Creating zones for SFUSD"
requires-python = ">=3.13"
dependencies = [
    "descartes>=1.1.0",
    "fastapi>=0.128.2",
    "geopandas>=1.1.2",
    "google-genai>=1.0.0",
    "gerrychain>=0.3.2",
    "gurobipy>=13.0.0",
    "httpx>=0.28.1",
    "kahip>=3.22",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "numpy>=2.4.0",
    "openai>=2.15.0",
    "ortools>=9.14.6206",
    "pandas>=2.3.3",
    "pandas-stubs~=2.3.3",
    "posthog>=7.8.2",
    "pymetis>=2025.2.2",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "scipy-stubs~=1.16.3",
    "seaborn>=0.13.2",
    "student-assignment",
    "uvicorn[standard]>=0.40.0",
]

[project.scripts]
sfusd-match = "sfusd_matching.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
student-assignment = { path = "../student-assignment", editable = true }

[tool.setuptools.packages.find]
include = [
    "Helper_Functions*",
    "LLM*",
    "Zone_Generation*",
    "redistricting*",
    "sfusd_matching*",
]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sfusd-zone"
version = "0.1.0"
description = "Creating zones for SFUSD"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "descartes>=1.1.0",
    "geopandas>=1.1.2",
    "gerrychain>=0.3.2",
    "gurobipy>=13.0.0",
    "kahip>=3.22",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "numpy>=2.4.0",
    "ortools>=9.14.6206",
    "pandas>=2.3.3",
    "pandas-stubs~=2.3.3",
    "pyyaml>=6.0.3",
    "ruff>=0.15.20",
    "scikit-learn>=1.8.0",
    "scipy-stubs~=1.16.3",
    "seaborn>=0.13.2",
    "student-assignment",
]

[project.scripts]
sfusd-match = "sfusd_matching.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
markers = [
    "real_data: requires prebuilt SFUSD graph caches",
]

[tool.uv.sources]
student-assignment = { git = "https://github.com/kchandra423/student-assignment-performance.git", branch = "main" }

[tool.setuptools.packages.find]
include = [
    "Config*",
    "choice*",
    "optimization*",
    "metrics*",
    "benchmark*",
    "redistricting*",
    "sfusd_matching*",
]

[tool.setuptools.package-data]
Config = ["*.yaml"]
optimization = ["*.yaml"]
benchmark = ["*.yaml", "configs/*.yaml"]
"benchmark.matching" = ["*.yaml"]

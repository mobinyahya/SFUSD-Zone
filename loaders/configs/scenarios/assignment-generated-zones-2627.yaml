# Generated-zone assignment sweeps on the 2026-27 transfer
#
# The 2026-27 counterpart of `assignment-generated-zones-2324`: the same
# 292 generated zone plans and the same citywide zone, run against the
# September 2026 SFUSD transfer year instead of 2023-24. Students, programs
# and kindergarten capacities come from that transfer, converted by
# `analysis/data_prep/convert_sfusd_transfer.py`; read
# `sfusd_transfer_report_2627.md` beside the cleaned tables before
# trusting a number from this scenario. School coordinates, categories and
# ratings are still the 2023-24 ones, each student holds a single preference
# list emitted as `r1_*` (the main round), and the choice-model utility
# estimate is still `utility.2324.exp8` because none has been fitted on
# 2026-27 preferences.
#
# From 2024-25 SFUSD auto-promotes TK students into kindergarten, so the
# kindergarten market is the Main Round applicants plus the promoted
# students; capacity is gross and reserves no promotion seat. See
# `analysis/data_prep/TK_PROMOTION_SPEC.md` and `loaders/README.md`.
#
# Two filters differ from the 2023-24 scenario. `capacity_profile` is
# `default` because the registry publishes no `status_quo` profile for these
# years; with `include_mission_bay: true` that selects the year's
# `mission_bay` variant, the closest analogue to the 2023-24 status-quo
# bundle, and it uses the same `assignment.schools.current_mission_bay`
# school table. 2026-27 is the first transfer year that actually carries
# Mission Bay ES, so it is also the only one of the three that sets
# `include_mission_bay: true`. The school is idSchool 1731 in the transfer,
# remapped to 999 by `RAW_SCHOOL_ID_ALIASES` in
# `analysis/data_prep/sfusd_transfer_schema.py`; this year's Main Round
# capacity file is the only one of the three that lists it, at K GE 69,
# MM 5 and AF 0 seats, and those are the capacities the market carries.
# The 2023-24 scenario's `999-GE-KG` is a counterfactual instead. The school
# opened in August 2026, so it cannot appear in 2023-24: no 2023-24 student
# enrols there, ranks it in any round, or has it as an attendance area, and
# its 66 seats are a planning figure hard-coded in
# `programs_statusQuo_2324.csv`, not a district capacity. 909 and 999 are
# both placeholder IDs for it, carried as two identical school rows. Treat a
# 2023-24 vs 2026-27 comparison of anything Mission Bay-touching as a
# counterfactual against a record, not as two observations. See the 2024-25
# and 2025-26 scenarios, which have no Mission Bay data at all.


# SFUSD 2024-25 through 2026-27 transfer (pooled optimization)
#
# Students and program offerings come from the September 2026 SFUSD transfer,
# converted by analysis/data_prep/convert_sfusd_transfer.py. Read the
# conversion report written beside the cleaned tables
# (sfusd_transfer_report_<year>.md) before trusting a number from this
# scenario: the transfer carries no capacity file, no school table, and only
# one preference round, so this scenario inherits
#
#   * 2023-24 program capacities wherever the transfer's programs exist in the
#     2023-24 district tables, and each program's observed per-year assignment
#     count where they do not (see the capacity_source column);
#   * 2023-24 school coordinates, categories, and ratings; and
#   * a single preference round, so `rounds: all` resolves to [1].
#
# The choice-model utility estimate is still the 2023-24 one; no estimate has
# been fitted on per-year preferences.
#
# Optimization pools all three transfer years so that block-level demand is
# estimated from three cohorts rather than one, which is what the checked-in
# multi-year scenarios do. Assignment runs on 2026-27, the newest year.

id: sfusd-2425-2627

sources:
  optimization.schools: optimization.schools.current
  optimization.programs: assignment.programs.2627.mission_bay
  optimization.capacity: capacity.stanford.scenarios_abcd
  optimization.census: census.blocks.2010
  optimization.crosswalk: census.block_crosswalk
  optimization.adjacency:
    block: census.adjacency.block
    blockgroup: census.adjacency.blockgroup
  optimization.centroids: bundled.centroids
  optimization.manual_edges:
    reviewed: bundled.manual_edges.reviewed
    additions: bundled.manual_edges.additions
  assignment.program_codes: assignment.program_codes
  assignment.capacity: capacity.stanford.scenarios_abcd
  assignment.estimate: utility.2324.exp8
  assignment.block_data: ctip.workbook.2013
  assignment.attendance_areas: assignment.attendance_areas.2013
  assignment.new_ctip: ctip.array.block.2024
  assignment.new_ctip_blockgroup: ctip.array.blockgroup.2024
  assignment.zones:
    Medium1: zones.common.medium1
    Z1: zones.common.z1
    optGE780873: zones.common.opt_ge_780873
    Large1: zones.common.large1
    Con0: zones.common.con0
    Con1: zones.common.con1
    Con2: zones.common.con2
    Con3: zones.common.con3
    59-zone-1_B: zones.common.59
    6-zone-1_BG: zones.common.6
    10-zone-11_BG: zones.common.10
    13-zone-7_BG: zones.common.13
    18-zone-1_1_BG: zones.common.18.1
    18-zone-1_2_BG: zones.common.18.2
  assignment.citywide_zones:
    Medium1-citywide: zones.citywide.medium1
    18zone-BG-0point3miles: zones.citywide.18_bg_0point3miles
  assignment.ctip:
    workbook: ctip.workbook.2013
    block: ctip.array.block.2024
    blockgroup: ctip.array.blockgroup.2024
  choice.estimate: utility.2324.exp8

filters:
  optimization:
    years: ["2425", "2526", "2627"]
    grades: [KG]
    student_population: applicant
    rounds: [1]
    special_programs: include
    program_population: All
    capacity_scenario: programs
    include_k8: false
    include_citywide_zoning: false
    include_citywide_choice_opt: true
    include_mission_bay: true
    geography_vintage: "2020"
    frl_estimate: updated_2526
    outside_district_students: ignore
  assignment:
    year: "2627"
    grades: [KG]
    student_population: applicant
    rounds: [1]
    special_programs: include
    capacity_profile: default
    capacity_scenario: programs
    include_mission_bay: true
    geography_vintage: "2020"
    frl_estimate: updated_2526
    outside_district_students: ignore

frl_dev: 0.3
racial_dev: 0.3
is_local: False

# fixed levers
#boundary_threshold: .05
shortage: .2 # this is in percentage
overage: .8 # this is in percentage
all_cap_shortage: .inf # this is in percentage
max_distance: 5 # best valid value for 59 zines: 1.272
population_dev: .inf


years: [ 14, 15, 16, 17, 18, 21, 22 ]
population_type: "GE"
drop_optout: True
#capacity_scenario: "Closure" # A
capacity_scenario: "A"
new_schools: True
include_k8: False
# 'Block', 'BlockGroup' or 'attendance_area'
# Block_0, Block_1, Block_2, Block_3
level: "BlockGroup_1"
recursive_levels: [ 'BlockGroup_1','BlockGroup_0' ]
relative_gap_limits: [ 0, 0 ]
solve_time_limits: [ 30,30 ] # seconds


# relative_gap_limit: 0.1
#log_folder: '.'
solve_time_limit: 60 # seconds
#stall_time_limit: 20 # seconds
random_seed: 42
# mip, cp_int, cp_bool
optimizer: 'cp_int'
hints: gerry_chain

# optimize with choice
optimize_with_choice: True
# simulate choice
simulate_choice: True


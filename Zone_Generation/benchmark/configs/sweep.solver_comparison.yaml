# Optimization-native benchmark sweep.

name: solver_comparison
mode: run  # run | metrics

optimization_defaults:
  save_solver_logs: true
  save_solver_progress: true
  strategy: single
  solve_time_limits: [600]
  max_distance: 4.52
  hints: gerry_chain
  workers: 1
  racial_dev: -1
  frl_dev: 0.15
  overage: 0.15
  shortage: 0.15
  recom_iterations: 1000000000
  recom_cut_attempts: 10000

sweep:
  centroids_type: ['6-zone-3',  '8-zone-24',  '10-zone-3', '13-zone-5']
  seed: [1, 2, 3, 4]
  levels: [Block_0, Block_1]

tasks:
  - solver: 'mip'
    secondary_objective: true
    workers: 8
  - solver: 'cp_bool'
    linearization_level: 2
    workers: 8
  - solver: 'relaxed_recom'
  - solver: 'short_bursts_recom'
    short_bursts_length: 25




execution:
  output_dir: '/share/data/school_choice/local_runs/solver_comparison_3/'
  capacity: 8         # total solver-thread slots available on the machine
  max_workers: 8            # max concurrent Python worker processes
  max_tasks_per_worker: 10   # recycle processes to limit memory growth
  skip_existing: true
  rerun_failed: true
  sequential: false

metrics:
  strict: true
  compute_stage_metrics: false
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

matching:
  enabled: false
  compute_stage_assignments: false

choice_metrics:
  enabled: false
  compute_stage_metrics: false

# Optimization-native benchmark sweep.

name: sfusd_zone_test
mode: run  # run | metrics

optimization_defaults:
  save_solver_logs: true
  carry_over_compute: true
  max_distance: 4
  use_hints: true
  capacity_scenario: 'A'
  racial_dev: -1
  looseness: 1.25
  gap_limits: [0, 0, 0]
  workers: 8

sweep:
  centroids_type: ['6-zone-3', '6-zone-9', '8-zone-22', '8-zone-24', '10-zone-3', '10-zone-11', '10-zone-9', '13-zone-5', '13-zone-6','13-zone-7', '18-zone-1', '18-zone-6', '18-zone-3']
  # '5-zone-2', '5-zone-AF',  '7-zone-14', '7-zone-19',
  frl_dev: [0.15]
  # 0.12, 0.15, 0.2,
  # ignoring racial deviations
  seed: [42]
  # 14, 33, 80, 9
  overage: [0.7, 0.8, 0.9]
  # 
  shortage: [0.15, 0.2, 0.25]
  # 0.15, 0.2,
  solver: ['cp_bool']

tasks:
  - strategy: 'single'
    levels: ['Block_0']
    solve_time_limits: [100]

  - strategy: 'recursive'
    levels: ['Block_1', 'Block_0']
    solve_time_limits: [200, 400]
    boundary_radius: 0

  - strategy: 'recursive'
    levels: ['Block_1', 'Block_0']
    solve_time_limits: [200, 400]
    boundary_radius: 1
  
  - strategy: 'recursive'
    levels: ['Block_1', 'Block_0']
    solve_time_limits: [200, 400]
    boundary_radius: 2

  # - strategy: 'recursive'
  #   levels: ['Block_1', 'Block_0']
  #   solve_time_limits: [600, 600]
  #   boundary_radius: 3

  # - strategy: 'recursive'
  #   levels: ['Block_2', 'Block_1', 'Block_0']
  #   solve_time_limits: [200, 400, 600]

execution:
  output_dir: '/share/data/school_choice/local_runs/sfusd_zone_test_3/'
  capacity: 48              # total solver-thread slots available on the machine
  max_workers: 10           # max concurrent Python worker processes
  max_tasks_per_worker: 10  # recycle processes to limit memory growth
  skip_existing: true
  rerun_failed: true
  sequential: false

metrics:
  strict: true
  compute_stage_metrics: false
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

matching:
  enabled: true
  configs:
    - name: no_reserves
      config: Zone_Generation/benchmark/matching/zones+no_reserves.yaml
    - name: soft_reserves
      config: Zone_Generation/benchmark/matching/zones+soft_reserves_06frl.yaml
    - name: hard_reserves
      config: Zone_Generation/benchmark/matching/zones+hard_reserves_06frl.yaml
  compute_stage_assignments: false

choice_metrics:
  enabled: true
  compute_stage_metrics: false

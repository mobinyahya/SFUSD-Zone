# Optimization-native benchmark sweep.

name: objective_comparison
mode: run  # run | metrics

optimization_defaults:
  save_solver_logs: true
  save_solver_progress: true
  strategy: single
  solve_time_limits: [500]
  max_distance: 4
  hints: gerry_chain
  capacity_scenario: 'A'
  levels: [Block_1]
  racial_dev: -1
  workers: 8
  cp_sat_search_strategy: distance_to_centroid
  cp_model_probing_level: 3 

sweep:
  centroids_type: ['6-zone-3',  '8-zone-24', '10-zone-3',  '13-zone-6']
  frl_dev: [0.15]
  seed: [42, 14, 33]
  overage: [0.15]
  shortage: [0.15]
  


tasks:
  - solver: 'cp_bool'
    secondary_objective: true
  - solver: 'cp_bool'
    secondary_objective: false
  - solver: 'mip'
    secondary_objective: true
  - solver: 'mip'
    secondary_objective: false




execution:
  output_dir: '/share/data/school_choice/local_runs/test_objectives_4/'
  capacity: 48             # total solver-thread slots available on the machine
  max_workers: 8            # max concurrent Python worker processes
  max_tasks_per_worker: 25  # recycle processes to limit memory growth
  skip_existing: false
  rerun_failed: true
  sequential: false

metrics:
  strict: true
  compute_stage_metrics: false
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

matching:
  enabled: false
  config: Zone_Generation/benchmark/matching/sd.yaml
  compute_stage_assignments: false

choice_metrics:
  enabled: false
  compute_stage_metrics: false

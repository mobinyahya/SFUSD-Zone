# Optimization-native benchmark sweep.

name: param_comparison
mode: run  # run | metrics

optimization_defaults:
  save_solver_logs: true
  save_solver_progress: true
  strategy: single
  solve_time_limits: [600]
  max_distance: 5
  use_hints: true
  capacity_scenario: 'A'
  racial_dev: -1
  workers: 8

sweep:
  centroids_type: ['5-zone-AF', '6-zone-3',  '8-zone-24', '10-zone-3',  '13-zone-6', '18-zone-1']
  frl_dev: [0.15]
  seed: [42, 14, 33]
  overage: [0.15]
  shortage: [0.15]
  solver: ['cp_bool']


tasks:
  - linearization_level: 2 # more linearized
  - cp_sat_search_strategy: distance_to_centroid # use dif search strat
  - cp_model_probing_level: 3 # more probing
  - strategy: single # base line 
  - linearization_level: 2 # multiple strats
    cp_sat_search_strategy: distance_to_centroid
    cp_model_probing_level: 3 




execution:
  output_dir: '/share/data/school_choice/local_runs/test_cp_params_2/'
  capacity: 48             # total solver-thread slots available on the machine
  max_workers: 8            # max concurrent Python worker processes
  max_tasks_per_worker: 25  # recycle processes to limit memory growth
  skip_existing: false
  rerun_failed: true
  sequential: false

metrics:
  strict: true
  compute_stage_metrics: false
  summary_csv: 'summary.csv'
  stages_csv: 'stages.csv'

matching:
  enabled: false
  config: Zone_Generation/benchmark/matching/sd.yaml
  compute_stage_assignments: false

choice_metrics:
  enabled: false
  compute_stage_metrics: false
